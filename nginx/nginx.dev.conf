events {
    worker_connections 1024;
}

http {
    upstream nextjs {
        server nextjs-dev:3000;
    }

    # Servidor HTTP - Redirecionamento para HTTPS
    server {
        listen 80;
        server_name sysemissor.terpens.com.br localhost;
        
        location / {
            return 301 https://$server_name:8443$request_uri;
        }
    }

    # Servidor HTTPS
    server {
        listen 443 ssl http2;
        server_name sysemissor.terpens.com.br localhost;

        # Configurações SSL
        ssl_certificate /etc/ssl/certs/sysemissor.terpens.com.br.crt;
        ssl_certificate_key /etc/ssl/certs/sysemissor.terpens.com.br.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # Headers de segurança
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Para Next.js hot reload
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
        }
    }
}